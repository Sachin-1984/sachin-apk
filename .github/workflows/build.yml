{"name":"Build APK","on":{"push":{"branches":["main"]},"workflow_dispatch":{}},"jobs":{"build":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"name":"Find project","run":"set -e\nls -la\nmkdir -p /tmp/proj/src\nfind . -maxdepth 2 -iname '*.zip' -not -path './.git/*' -exec cp {} /tmp/proj/src/ \\;\ncp -r . /tmp/proj/src/raw && rm -rf /tmp/proj/src/raw/.git\nfor i in 1 2 3; do find /tmp/proj -iname '*.zip' | while IFS= read -r Z; do if [ ! -e \"$Z.done\" ]; then unzip -qo \"$Z\" -d \"$Z.dir\" || true; touch \"$Z.done\"; fi; done; done\necho \"--- settings.gradle found at ---\"\nfind /tmp/proj -name settings.gradle\nS=$(find /tmp/proj -name settings.gradle -print -quit)\nif [ -z \"$S\" ]; then echo \"ERROR: settings.gradle sapadle nahi\"; find /tmp/proj -maxdepth 4 | head -80; exit 1; fi\necho \"PROJECT_DIR=$(dirname \"$S\")\" >> \"$GITHUB_ENV\"\necho \"Project dir: $(dirname \"$S\")\""},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"17"}},{"uses":"gradle/actions/setup-gradle@v4","with":{"gradle-version":"8.7"}},{"name":"Build debug APK","working-directory":"${{ env.PROJECT_DIR }}","run":"gradle assembleDebug --no-daemon --stacktrace"},{"uses":"actions/upload-artifact@v4","with":{"name":"Sachin-APK","path":"${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk"}}]}}}
